services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: aicompany
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-dev-only}
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U postgres"], interval: 5s, timeout: 3s, retries: 10 }
  api:
    build: .
    environment: { DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD:-local-dev-only}@db:5432/aicompany, JWT_SECRET: ${JWT_SECRET}, PORT: "3000", WEB_ORIGIN: http://localhost:5173 }
    depends_on: { db: { condition: service_healthy } }
    ports: ["3000:3000"]
  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    ports: ["5173:5173"]
volumes: { pgdata: {} }
